  .subtitle { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

  .mode-btn {

  .viewer-only-tag { display: flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-dim); padding: 7px 10px; }

  .progress-label { margin-top: 6px; font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }

  .row-recall-entry { padding: 10px 12px 12px 46px; background: var(--panel); border-bottom: 1px solid var(--border); }

function buildParticipantIndex() {
  const registry = new Map();
  let nextBib = 1;
  const groupEntries = new Map();
  ENTRY_GROUPS.forEach(g => {
    const entries = g.pairs ? g.pairs.map(p => p.join(" ・ ")) : g.solo;
    const rosterEntries = [];
    entries.forEach(name => {
      let bib = registry.get(name);
      if (!bib) { bib = String(nextBib++); registry.set(name, bib); }
      rosterEntries.push({ bib, name });
    });
    groupEntries.set(`${g.section}|${g.cls}|${g.event}`, rosterEntries);
  });
  return groupEntries;
}
const GROUP_ENTRIES = buildParticipantIndex();
function entriesForItem(item) {
  if (isSpecial(item.section)) return null;
  return GROUP_ENTRIES.get(`${item.section}|${item.cls}|${normalizeEvent(item.event)}`) || null;
}
function parseRecallTokens(text) {
  return (text || "").split(/[,、\s]+/).map(t => t.trim()).filter(Boolean);
}
function sectionTone(section) {
  if (section.includes("ラテン")) return "latin";
  if (section.includes("ボールルーム")) return "ballroom";
  if (section === "break") return "break";
  if (section === "ceremony") return "ceremony";
  if (section === "show") return "show";
  return "neutral";
}

async function fetchSharedState() {

}
async function pushSharedState(state) {
  const url = `${GAS_ENDPOINT}?data=${encodeURIComponent(JSON.stringify(state))}`;

}

/* ============ 通信ロジック ============ */
let lastLocalWriteAt = 0;
const WRITE_GRACE_MS = 6000; // 自分の書き込み直後は、追いついていないpollの結果を無視する

function isUserEditing() {
  const el = document.activeElement;
  return !!(el && (el.classList.contains("recall-input") || el.classList.contains("pin-input")));
}

async function fetchState() {
  try {
    const parsed = await fetchSharedState();

    // 自分がついさっき書き込んだ直後は、サーバー側の反映が追いついていない
    // 古いデータで巻き戻ってしまうことがあるため、少しの間はpollの結果を無視する
    if (Date.now() - lastLocalWriteAt < WRITE_GRACE_MS) {
      state.loaded = true;
      return;
    }

    const nextIdx = parsed.currentIdx ?? 0;
    const nextUpdatedAt = parsed.updatedAt ?? null;
    const nextRecalls = parsed.recalls ?? {};
    const changed =
      nextIdx !== state.currentIdx ||
      nextUpdatedAt !== state.updatedAt ||
      JSON.stringify(nextRecalls) !== JSON.stringify(state.recalls);
    const hadError = state.loadError;

    state.currentIdx = nextIdx;
    state.updatedAt = nextUpdatedAt;
    state.recalls = nextRecalls;
    state.loadError = false;

    const wasFirstLoad = !state.loaded;
    state.loaded = true;

    // 変化がない時は再描画しない(スクロール位置や入力中の内容を保持するため)
    if (!changed && !hadError && !wasFirstLoad) return;
    if (isUserEditing()) { state.pendingRender = true; return; }
    render();
  } catch (e) {
    console.error("読み込みに失敗しました", e);
    state.loadError = true;
    state.loaded = true;
    if (isUserEditing()) { state.pendingRender = true; return; }
    render();
  }
}

async function pushState(idx, recallMap) {
  recallMap = recallMap || state.recalls;
  const ts = new Date().toISOString();
  state.currentIdx = idx;
  state.updatedAt = ts;
  lastLocalWriteAt = Date.now();
  render();
  const hadError = state.saveError;
  try {
    await pushSharedState({ currentIdx: idx, updatedAt: ts, recalls: recallMap });
    state.saveError = false;
  } catch (e) {
    console.error("保存に失敗しました", e);
    state.saveError = true;
  }
  // 見た目に変化がある時(エラー状態が変わった時)だけ再描画する
  if (state.saveError !== hadError) render();
}

function saveRecall() {
  const noKey = String(ITEMS[state.currentIdx].no);
  const nextRecalls = { ...state.recalls, [noKey]: state.recallDraft.trim() };
  state.recalls = nextRecalls;
  state.recallSaved = true;
  state.expandedRows.add(ITEMS[state.currentIdx].no);
  render();
  setTimeout(() => { state.recallSaved = false; render(); }, 1500);
  pushState(state.currentIdx, nextRecalls);
}

async function pushRecalls(nextRecalls) {
  const ts = new Date().toISOString();
  state.recalls = nextRecalls;
  state.updatedAt = ts;
  lastLocalWriteAt = Date.now();
  const hadError = state.saveError;
  try {
    await pushSharedState({ currentIdx: state.currentIdx, updatedAt: ts, recalls: nextRecalls });
    state.saveError = false;
  } catch (e) {
    console.error("保存に失敗しました", e);
    state.saveError = true;
  }
  if (state.saveError !== hadError) render();
}

function onRowRecallDraftChange(no, value) {
  state.rowRecallDrafts[no] = value;
}

function saveRowRecall(no) {
  // 進行位置(currentIdx)には一切触れず、その行の勝ち上がりだけを更新する
  const value = (state.rowRecallDrafts[no] ?? "").trim();
  const nextRecalls = { ...state.recalls, [String(no)]: value };
  state.rowRecallSavedNo = no;
  render();
  setTimeout(() => { state.rowRecallSavedNo = null; render(); }, 1500);
  pushRecalls(nextRecalls);
}

function goNext() { if (state.currentIdx < ITEMS.length - 1) pushState(state.currentIdx + 1); }
function goPrev() { if (state.currentIdx > 0) pushState(state.currentIdx - 1); }
function resetAll() { pushState(0); }
function toggleRow(no) {
  if (state.expandedRows.has(no)) state.expandedRows.delete(no); else state.expandedRows.add(no);
  render();
}
function requestStaffMode() {
  if (state.unlocked) { state.mode = "staff"; render(); return; }
  state.pinValue = ""; state.pinError = false; state.showPinPrompt = true; render();
}
function submitPin() {
  if (state.pinValue === STAFF_PIN) { state.unlocked = true; state.showPinPrompt = false; state.mode = "staff"; }
  else { state.pinError = true; }
  render();
}
function lockStaffMode() { state.unlocked = false; state.mode = "viewer"; render(); }
function setViewerMode() { state.mode = "viewer"; render(); }
function onRecallDraftChange(v) { state.recallDraft = v; }
function onPinChange(v) { state.pinValue = v; state.pinError = false; }
function onFieldBlur() {
  if (state.pendingRender) {
    state.pendingRender = false;
    render();
  }
}

/* ============ 描画 ============ */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function renderNowCard(current) {
  const tone = sectionTone(current.section);
  const noKey = String(current.no);
  const currentRecall = state.recalls[noKey];
  let banner = "";
  if (currentRecall) {
    banner = `<div class="recall-banner"><div class="recall-label">UP</div><div class="recall-numbers">${esc(currentRecall)}</div></div>`;
  } else if (current.up != null && current.up > 0) {
    banner = `<div class="up-banner">UP ${current.up}組(背番号未入力)</div>`;
  }
  let body;
  if (isSpecial(current.section)) {
    body = `<div class="now-special">${esc(current.cls)}</div>`;
  } else {
    body = `
      <div class="now-main-row"><span class="now-section">${esc(current.section)}</span><span class="now-class">${esc(current.cls)}</span></div>
      <div class="now-event-row"><span class="now-event">${esc(current.event)}</span><span class="now-round">${esc(current.round)}</span></div>
      <div class="now-meta">
        <span class="meta-chip">${icon("clock")} ${esc(current.time)}</span>
        ${current.heat > 0 ? `<span class="meta-chip">ヒート ${current.heat}</span>` : ""}
        ${current.pairs > 0 ? `<span class="meta-chip">${icon("users")} ${current.pairs}組</span>` : ""}
        ${current.judge ? `<span class="meta-chip">${icon("gavel")} 主任 ${esc(current.judge)}</span>` : ""}
      </div>`;
  }
  return `<section class="now-card" style="border-left-color:${TONE_COLOR[tone]}"><div class="now-label">NOW</div>${body}${banner}</section>`;
}

    const recallText = state.recalls[String(item.no)];
    const rowClasses = ["row", "clickable", rstate === "current" ? "current" : "", rstate === "done" ? "done" : ""].filter(Boolean).join(" ");

    let bodyHtml;
    if (isSpecial(item.section)) {
      bodyHtml = `<span class="row-special">${esc(item.cls)}</span>`;
    } else {
      bodyHtml = `<span><strong>${esc(item.section)}</strong> ${esc(item.cls)} ${esc(item.event)} ${esc(item.round)}${item.heat > 1 ? ` (${item.heat}ヒート)` : ""}</span>`;
    }
    const recallLine = recallText ? `<div class="row-recall">UP: ${esc(recallText)}</div>` : "";

    const statusHtml = `
      ${rstate === "current" ? `<span class="badge-now">進行中</span>` : ""}
      ${rstate === "done" ? `<span class="badge-done">終了</span>` : ""}
      ${entries ? `<button class="expand-btn" onclick="event.stopPropagation(); toggleRow(${item.no})">${isExpanded ? "背番号 ▲" : "背番号 ▼"}</button>` : ""}`;

    const advancedSet = new Set(parseRecallTokens(recallText));
    const chipsHtml = (isExpanded && entries) ? `
      <div class="bib-chip-row">
        ${entries.map(e => `<span class="bib-chip ${advancedSet.has(e.bib) ? "advanced" : ""}">${esc(e.bib)}</span>`).join("")}
      </div>
      ${(state.mode === "staff" && item.up != null && item.up > 0) ? `
      <div class="row-recall-entry">
        <div class="recall-entry-label">この行のUP背番号(進行には触れません)</div>
        <div class="recall-entry-row">
          <input class="recall-input row-recall-input" type="text" data-no="${item.no}" value="${esc(state.rowRecallDrafts[item.no] ?? (recallText || ""))}"
            oninput="onRowRecallDraftChange(${item.no}, this.value)" onkeydown="if(event.key==='Enter') saveRowRecall(${item.no})" onblur="onFieldBlur()" placeholder="例: 12, 15, 22, 30" />
          <button class="ctrl-btn ctrl-primary" style="flex:0 0 auto; padding:10px 16px;" onclick="event.stopPropagation(); saveRowRecall(${item.no})">${state.rowRecallSavedNo === item.no ? "保存済" : "保存"}</button>
        </div>
      </div>` : ""}` : "";

    return `
      <div class="${rowClasses}" style="border-left:4px solid ${TONE_COLOR[tone]}" onclick="toggleRow(${item.no})">
        <div class="row-no">${item.no}</div>
        <div class="row-time">${esc(item.time)}</div>
        <div class="row-body">${bodyHtml}${recallLine}</div>
        <div class="row-status">${statusHtml}</div>
      </div>
      ${chipsHtml}`;
  }).join("");

  const setupNotice = !GAS_ENDPOINT.startsWith("https://script.google.com/macros/") ? `
    <div class="setup-notice">⚠ GAS_ENDPOINT が未設定です。コード上部の GAS_ENDPOINT に、デプロイしたGoogle Apps ScriptのウェブアプリURLを貼り付けてください。</div>` : "";

  document.getElementById("app").innerHTML = `
    <header>
      <div class="header-top">
        <div>
          <div class="eyebrow">PROGRESS BOARD</div>
          <h1>2026 前期中部日本ダンス選手権</h1>
          <div class="subtitle">併催：2026 中部ダンスフェスティバル in 名古屋</div>
        </div>
        <div class="mode-toggle">${modeToggleHtml}</div>
      </div>
      ${setupNotice}
      ${pinHtml}
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="progress-label">NO.${current.no} / ${ITEMS.length}　${progressPct}%</div>
    </header>

    ${renderNowCard(current)}
    ${nextHtml}
    ${controlsHtml}
    ${recallEntryHtml}

    <div class="list-wrap">${rowsHtml}</div>

    <footer>
      ${state.loadError ? `<span class="err">⚠ 読み込みに失敗しました　</span>` : ""}
      ${state.saveError ? `<span class="err">⚠ 保存に失敗しました　</span>` : ""}
      ${state.updatedAt ? `最終更新 ${new Date(state.updatedAt).toLocaleTimeString("ja-JP")}` : "同期待機中"}　
      ${state.mode === "viewer" ? "· 観覧モード（自動更新）" : "· 運営モード（タップで進行を操作）"}
    </footer>

    <div class="nexus-credit">
      <svg width="18" height="18" viewBox="0 0 40 40" fill="none">
        <path d="M20 3 L34 20 L20 37 L6 20 Z" stroke="#ff5a4e" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="3" fill="#ff5a4e"/>
        <circle cx="20" cy="9" r="2" fill="#999999"/><circle cx="29" cy="20" r="2" fill="#999999"/>
        <circle cx="20" cy="31" r="2" fill="#999999"/><circle cx="11" cy="20" r="2" fill="#999999"/>
        <line x1="20" y1="20" x2="20" y2="9" stroke="#999999"/><line x1="20" y1="20" x2="29" y2="20" stroke="#999999"/>
        <line x1="20" y1="20" x2="20" y2="31" stroke="#999999"/><line x1="20" y1="20" x2="11" y2="20" stroke="#999999"/>
      </svg>
      <span>
        <span class="nexus-word">Created by NEXUS ENTERTAINMENT</span>
        <span class="nexus-tagline">進行も、演出も。窓口はひとつに。</span>
      </span>
    </div>`;

  // スクロール位置を現在の行に合わせる(進行が実際に変わった時だけ)
  if (state.currentIdx !== lastScrolledIdx) {
    lastScrolledIdx = state.currentIdx;
    const listWrap = document.querySelector(".list-wrap");
    const currentRow = document.querySelector(".row.current");
    if (listWrap && currentRow) {
      const wrapRect = listWrap.getBoundingClientRect();
      const rowRect = currentRow.getBoundingClientRect();
      if (rowRect.top < wrapRect.top || rowRect.bottom > wrapRect.bottom) {
        listWrap.scrollTop += (rowRect.top - wrapRect.top) - (wrapRect.height / 2);
      }
    }
  }
}
let lastScrolledIdx = -1;

/* ============ 起動 ============ */
render();
fetchState();
setInterval(fetchState, POLL_MS);
</script>
</body>
</html>
