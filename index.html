<style>
  :root {
    --bg: #fafafa;
    --panel: #ffffff;
    --panel2: #f0f0f0;
    --border: #e2e2e2;
    --text: #111111;
    --text-dim: #666666;
    --text-dim2: #999999;
    --ink: #111111;
    --accent: #ff2d78;
    --accent2: #ff2d78;
    --on-accent: #ffffff;
    --ballroom: #3fa9f5;
    --latin: #ff6a3d;
    --red: #c0392b;
    --current-bg: #ffe1dd;
    --warn-bg: #fde6d8;
    --warn-border: #f2b98e;
    --warn-text: #7a3b1a;
    --ceremony: #8a6d1f;
    --show: #5a4a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Sans', 'Yu Gothic', system-ui, -apple-system, sans-serif;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cccccc; border-radius: 4px; }
  input:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

  header {
    /* --collapse は 0(展開)〜1(折りたたみ) の連続値。スクロール量にそのまま連動させ、
       しきい値やCSSトランジションを介さないことで、どんな速度のスクロールでも
       指の動きと1:1でズレなく追従するようにしている。 */
    padding:
      calc(20px + env(safe-area-inset-top) - 10px * var(--collapse, 0))
      18px
      calc(14px - 6px * var(--collapse, 0));
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top { display: flex; flex-direction: column; gap: 8px; }
  .header-title-row { display: flex; flex-direction: column; }
  .header-toggle-row { display: flex; justify-content: flex-end; }
  .eyebrow {
    font-size: 11px; letter-spacing: .14em; color: var(--accent); font-weight: 700;
    overflow: hidden;
    margin-bottom: calc(4px - 4px * var(--collapse, 0));
    max-height: calc(18px - 18px * var(--collapse, 0));
    opacity: calc(1 - var(--collapse, 0));
  }
  h1 {
    font-size: calc(19px - 4px * var(--collapse, 0));
    font-weight: 700; margin: 0; color: var(--ink); line-height: 1.25;
  }
  .subtitle {
    font-size: 12px; color: var(--text-dim); overflow: hidden;
    margin-top: calc(3px - 3px * var(--collapse, 0));
    max-height: calc(18px - 18px * var(--collapse, 0));
    opacity: calc(1 - var(--collapse, 0));
  }
  .progress-label {
    font-size: 11px; color: var(--text-dim); letter-spacing: .04em; overflow: hidden;
    margin-top: calc(6px - 6px * var(--collapse, 0));
    max-height: calc(16px - 16px * var(--collapse, 0));
    opacity: calc(1 - var(--collapse, 0));
  }

  .now-sticky {
    position: sticky; top: var(--header-h, 96px); z-index: 8;
    background: var(--bg); padding: 10px 16px 0;
  }

  .mode-toggle { display: flex; gap: 4px; background: var(--ink); padding: 4px; border-radius: 10px; }
  .mode-btn {
    display: flex; align-items: center; justify-content: center; border: none; background: transparent;
    color: #bbbbbb; padding: 8px; width: 34px; height: 34px;
    border-radius: 7px; cursor: pointer;
  }
  .mode-btn.active { background: var(--accent); color: var(--on-accent); }
  .viewer-only-tag { display: flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-dim); padding: 7px 10px; }

  .setup-notice {
    margin-top: 12px; font-size: 11px; line-height: 1.6; color: var(--warn-text);
    background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 8px; padding: 8px 10px;
  }
  .sync-warning {
    margin-bottom: 10px; font-size: 12px; line-height: 1.5; font-weight: 700; color: #ffffff;
    background: var(--red); border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 8px;
  }

  .progress-track { margin-top: 14px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .4s ease; }
  .progress-label { margin-top: 6px; font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }

  .now-card {
    margin: 0; background: var(--panel2); border-radius: 14px; border-left: 6px solid;
    padding: 14px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
  }
  .now-label {
    display: inline-block; font-size: 11px; letter-spacing: .16em; color: var(--accent); font-weight: 800;
    background: transparent; border: 1.5px solid var(--accent); padding: 2px 10px; border-radius: 20px; margin-bottom: 10px;
  }
  .now-special { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .now-main-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .now-section { font-size: 15px; font-weight: 700; color: var(--ink); }
  .now-class { font-size: 14px; color: var(--text-dim); }
  .now-event-row { margin-top: 4px; display: flex; align-items: baseline; gap: 10px; }
  .now-event { font-size: 26px; font-weight: 800; letter-spacing: .02em; color: var(--ink); }
  .now-round { font-size: 14px; color: var(--accent); font-weight: 700; }
  .now-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .meta-plain { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); }
  .meta-chip { display: flex; align-items: center; gap: 5px; font-size: 12px; background: var(--panel); color: var(--text-dim); padding: 5px 10px; border-radius: 20px; }
  .meta-chip.up { background: color-mix(in srgb, var(--accent) 16%, var(--panel)); color: var(--accent); font-weight: 800; }



  .controls-sticky {
    position: sticky; top: calc(var(--header-h, 96px) + var(--now-h, 0px)); z-index: 9;
    background: var(--bg); padding: 14px 16px 0;
  }
  .controls { display: flex; gap: 8px; }
  .ctrl-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-size: 14px; font-weight: 700; padding: 12px 10px; border-radius: 10px; cursor: pointer;
  }
  .ctrl-btn:disabled { opacity: .4; cursor: default; }
  .ctrl-primary { background: var(--accent); color: var(--on-accent); border: none; }
  .ctrl-ghost { flex: 0 0 auto; padding: 12px 14px; color: var(--text-dim); }
  .ctrl-confirm { background: var(--red); color: var(--on-accent); border: none; }

  .link-row { margin: 8px 16px 0; }
  .link-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px dashed var(--border); background: transparent; color: var(--text-dim);
    font-size: 12px; font-weight: 600; padding: 9px 10px; border-radius: 10px; cursor: pointer;
  }
  .link-btn.copied { color: var(--accent); border-color: var(--accent); }

  .filter-sticky {
    position: sticky; top: calc(var(--header-h, 96px) + var(--now-h, 0px) + var(--controls-h, 0px)); z-index: 7;
    background: var(--bg); padding-top: 10px; padding-bottom: 4px;
  }
  .filter-row {
    display: flex; gap: 6px; margin: 0 16px; overflow-x: auto; padding-bottom: 2px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-pill {
    flex: 0 0 auto; font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text-dim); cursor: pointer; white-space: nowrap;
  }
  .filter-pill.active { background: var(--ink); color: #ffffff; border-color: var(--ink); }

  .list-wrap { margin: 12px 12px 0; border-radius: 12px; background: var(--panel2); }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; scroll-margin-top: var(--sticky-offset, 110px); }
  .row.current { background: var(--current-bg); position: relative; }
  .row.current::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: 0 0 12px 3px color-mix(in srgb, var(--accent) 45%, transparent);
    animation: pulse-glow 2.4s ease-in-out infinite alternate;
  }
  .row.done { opacity: .5; }
  .row-no { width: 22px; font-size: 11px; color: var(--text-dim2); font-weight: 700; flex-shrink: 0; }
  .row-time { width: 52px; font-size: 16px; font-weight: 800; color: var(--ink); flex-shrink: 0; }
  .row-body { flex: 1; color: var(--text); line-height: 1.4; }
  .row-line1 { font-size: 13px; font-weight: 700; color: var(--ink); }
  .row-line1 .row-cls { font-weight: 500; color: var(--text-dim); margin-left: 6px; }
  .row-line2 { margin-top: 2px; font-size: 12px; }
  .row-line2 .row-event { font-weight: 700; color: var(--text); }
  .row-line2 .row-round { font-weight: 600; color: var(--accent); margin-left: 6px; }
  .row-line2 .row-heat { color: var(--text-dim2); margin-left: 4px; }
  .row-special { color: var(--text-dim); }
  .row-status { flex-shrink: 0; text-align: right; }
  .badge-now { font-size: 10px; font-weight: 800; background: var(--accent); color: var(--on-accent); padding: 3px 8px; border-radius: 12px; }
  .badge-done { font-size: 10px; color: var(--text-dim2); }

  @keyframes pulse-glow {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .row.current::after { animation: none; opacity: 0; }
  }

  footer { text-align: center; font-size: 11px; color: var(--text-dim2); margin-top: 14px; padding-bottom: env(safe-area-inset-bottom); }
  footer .err { color: var(--red); font-weight: 700; }

  .nexus-credit { display: flex; align-items: center; justify-content: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .nexus-card {
    display: flex; align-items: center; gap: 10px;
    background: #12151C; border-radius: 10px; padding: 9px 16px;

  .nexus-word { font-family: 'Shippori Mincho', Georgia, serif; font-size: 12px; font-weight: 600; letter-spacing: .05em; color: #ECE8DE; }
  .nexus-tagline { display: block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 8px; letter-spacing: .04em; color: #8B8F99; margin-top: 2px; }

  .pin-overlay { position: fixed; inset: 0; background: rgba(17,17,17,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .pin-card { width: 100%; max-width: 280px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: 0 12px 32px rgba(0,0,0,.2); }
  .pin-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .pin-input { width: 100%; font-size: 20px; letter-spacing: .3em; text-align: center; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
  .pin-error { font-size: 11px; color: var(--red); margin-top: 6px; }
  .pin-btn-row { display: flex; gap: 8px; margin-top: 14px; }

  .icon { display: inline-block; vertical-align: -2px; }

function sectionTone(section) {

}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* ============ ネットワーク ============ */
async function fetchSharedState() {
  // cache: "no-store" で、途中の経路(ブラウザ/モバイル回線のキャッシュ等)に
  // 古いレスポンスを返させないようにする
  const res = await fetch(GAS_ENDPOINT, { method: "GET", cache: "no-store" });
  if (!res.ok) throw new Error("fetch failed: " + res.status);
  return await res.json();
}
async function pushSharedState(state) {
  const url = `${GAS_ENDPOINT}?data=${encodeURIComponent(JSON.stringify(state))}`;
  await fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" });
}
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

/* ============ 通信ロジック ============ */
let lastLocalWriteAt = 0;
const WRITE_GRACE_MS = 30000; // 自分の書き込み直後は、追いついていないpollの結果を無視する(GASの反映タイムラグを考慮し余裕を持たせる)

function isUserEditing() {
  const el = document.activeElement;
  return !!(el && el.classList.contains("pin-input"));
}

let fetchInFlight = false; // 前回の問い合わせがまだ終わっていない間は、次のポーリングを重ねて送らない
                            // (遅れて返ってきた古い結果が、後から来た新しい結果を上書きして
                            //  「セクションが行ったり来たりする」ように見える競合を防ぐため)
async function fetchState() {
  if (fetchInFlight) return;
  fetchInFlight = true;
  try {
    const parsed = await fetchSharedState();

    // 自分がついさっき書き込んだ直後は、サーバー側の反映が追いついていない
    // 古いデータで巻き戻ってしまうことがあるため、少しの間はpollの結果を無視する
    if (Date.now() - lastLocalWriteAt < WRITE_GRACE_MS) {
      state.loaded = true;
      state.consecutiveFailures = 0;
      return;
    }

    const nextIdx = parsed.currentIdx ?? 0;
    const nextUpdatedAt = parsed.updatedAt ?? null;
    const changed = nextIdx !== state.currentIdx || nextUpdatedAt !== state.updatedAt;
    const hadError = state.loadError;
    const hadFailures = state.consecutiveFailures > 0;

    state.currentIdx = nextIdx;
    state.updatedAt = nextUpdatedAt;
    state.loadError = false;
    state.consecutiveFailures = 0;

    const wasFirstLoad = !state.loaded;
    state.loaded = true;

    // 変化がない時は再描画しない(スクロール位置を保持するため)
    if (!changed && !hadError && !hadFailures && !wasFirstLoad) return;
    if (isUserEditing()) { state.pendingRender = true; return; }
    render();
  } catch (e) {
    console.error("読み込みに失敗しました", e);
    state.loadError = true;
    state.loaded = true;
    state.consecutiveFailures += 1;
    if (isUserEditing()) { state.pendingRender = true; return; }
    render();
  } finally {
    fetchInFlight = false;
  }
}

// 書き込みは「送りっぱなし」にせず、実際に反映されたかを再取得して確認する。
// GASは書き込み直後の読み取りに、数秒〜まれに20秒近いタイムラグが出ることがある(既知の制約)。
// これより短い時間で「失敗」と判定すると、実際には成功しているのに誤警告を出してしまうため、
// 間隔を空けながら気長に(合計25秒程度)確認する。再送信は最後の保険としてのみ行う。
//
// 素早く連続でボタンを押すと(進める→戻す、など)、それぞれの操作が並行して最大27秒間
// 確認処理を続けてしまい、GASへのリクエストが渋滞して通常のポーリングまで巻き込まれることがある。
// これを防ぐため、「今一番新しい操作」だけを追いかけ、後から別の操作が来たら
// 古い方の確認処理はその場で諦めて通信を止める(writeGenerationで判定)。
const CONFIRM_WAITS_MS = [3000, 5000, 7000, 8000]; // 累計 約23秒
let writeGeneration = 0;
async function pushStateWithRetry(idx, ts, myGeneration) {
  lastLocalWriteAt = Date.now();
  try {
    await pushSharedState({ currentIdx: idx, updatedAt: ts });
  } catch (e) {
    console.error("送信に失敗しました", e);
  }
  for (const waitMs of CONFIRM_WAITS_MS) {
    if (myGeneration !== writeGeneration) return true; // より新しい操作に上書きされたので、この確認はもう追いかけない
    await sleep(waitMs);
    if (myGeneration !== writeGeneration) return true;
    lastLocalWriteAt = Date.now(); // 確認中も、pollがこの書き込みを邪魔しないよう猶予を延長し続ける
    try {
      const confirmed = await fetchSharedState();
      if (confirmed && confirmed.updatedAt === ts) return true; // 反映を確認できた
    } catch (e) {
      console.error("反映確認のための読み込みに失敗しました", e);
    }
  }
  if (myGeneration !== writeGeneration) return true;
  // ここまで(約23秒)確認できなければ、念のため一度だけ送信し直して、もう少しだけ待つ
  console.warn("反映を確認できなかったため再送信します");
  lastLocalWriteAt = Date.now();
  try {
    await pushSharedState({ currentIdx: idx, updatedAt: ts });
  } catch (e) {
    console.error("再送信に失敗しました", e);
  }
  await sleep(4000);
  if (myGeneration !== writeGeneration) return true;
  try {
    const confirmed = await fetchSharedState();
    if (confirmed && confirmed.updatedAt === ts) return true;
  } catch (e) {
    console.error("再送信後の反映確認に失敗しました", e);
  }
  return false;
}

async function pushState(idx) {
  const ts = new Date().toISOString();
  state.currentIdx = idx;
  state.updatedAt = ts;
  lastLocalWriteAt = Date.now();
  forceScrollNext = true; // 運営が自分でボタンを押した時は、直前の手動スクロールに関係なく必ず追従する
  render();
  writeGeneration += 1;
  const myGeneration = writeGeneration;
  const hadError = state.saveError;
  const ok = await pushStateWithRetry(idx, ts, myGeneration);
  if (myGeneration !== writeGeneration) return; // さらに新しい操作が行われていたら、この結果は無視する
  state.saveError = !ok;
  if (state.saveError !== hadError) render();
}

function goNext() { if (state.currentIdx < ITEMS.length - 1) pushState(state.currentIdx + 1); }
function goPrev() { if (state.currentIdx > 0) pushState(state.currentIdx - 1); }
let resetConfirmTimer = null;
function resetAll() {
  if (!state.confirmReset) {
    // 1回目のタップ:誤操作防止のため、すぐには実行せず確認状態にする
    state.confirmReset = true;
    render();
    clearTimeout(resetConfirmTimer);
    resetConfirmTimer = setTimeout(() => { state.confirmReset = false; render(); }, 3000);
    return;
  }
  // 2回目のタップ(3秒以内)で実際に最初へ戻す
  clearTimeout(resetConfirmTimer);
  state.confirmReset = false;
  pushState(0);
}
function setSectionFilter(name) { state.sectionFilter = name; render(); }
function copyViewerLink() {
  const url = location.origin + location.pathname + "?mode=viewer";
  const done = () => {
    state.linkCopied = true;
    render();
    setTimeout(() => { state.linkCopied = false; render(); }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => { prompt("このURLをコピーしてください", url); });
  } else {
    prompt("このURLをコピーしてください", url);
  }
}
function requestStaffMode() {
  if (state.unlocked) { state.mode = "staff"; render(); return; }
  state.pinValue = ""; state.pinError = false; state.showPinPrompt = true; render();
}
function submitPin() {
  if (state.pinValue === STAFF_PIN) { state.unlocked = true; state.showPinPrompt = false; state.mode = "staff"; }
  else { state.pinError = true; }
  render();
}
function lockStaffMode() { state.unlocked = false; state.mode = "viewer"; render(); }
function setViewerMode() { state.mode = "viewer"; render(); }
function onPinChange(v) { state.pinValue = v; state.pinError = false; }
function onFieldBlur() {
  if (state.pendingRender) {
    state.pendingRender = false;
    render();
  }
}

/* ============ 描画 ============ */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function renderNowCard(current) {
  const tone = sectionTone(current.section);

  if (isSpecial(current.section)) {

  if (state.currentIdx !== lastScrolledIdx) {
    if (Date.now() < manualScrollUntil && !forceScrollNext) {
      // 手動でスクロール中なので今回は自動スクロールを見送る(次の進行変化 or 猶予終了後に追いつく)
      // ↑この場合もlastScrolledIdxは更新しないので、猶予が切れた後の次の再描画で追いつける
    } else {
      forceScrollNext = false;
      lastScrolledIdx = state.currentIdx;
      const currentRow = document.querySelector(".row.current");
      const stickyBar = document.querySelector(".filter-sticky") || document.querySelector(".controls-sticky") || document.querySelector(".now-sticky") || document.querySelector("header");
      if (currentRow && stickyBar) {
        // 固定バー(ヘッダー+操作ボタン)の高さぶん、行の上に余白を持たせてからscrollIntoViewに任せる。
        // 座標を自前で計算してscrollToするより、モバイルのアドレスバー出し入れ等による
        // ビューポート変化に強い(ブラウザ側が都度再計算してくれるため)。
        const offset = stickyBar.getBoundingClientRect().bottom + 8;
        document.documentElement.style.setProperty("--sticky-offset", offset + "px");
        currentRow.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
  }
}
let lastScrolledIdx = -1;
let forceScrollNext = false;
let manualScrollUntil = 0;
const MANUAL_SCROLL_GRACE_MS = 8000; // この間は「閲覧者が自分でスクロール中」とみなし、自動スクロールを止める
function markManualScroll() { manualScrollUntil = Date.now() + MANUAL_SCROLL_GRACE_MS; }

function syncHeaderHeightVar() {
  const header = document.querySelector("header");
  if (header) document.documentElement.style.setProperty("--header-h", header.getBoundingClientRect().height + "px");
  const nowSticky = document.querySelector(".now-sticky");
  if (nowSticky) document.documentElement.style.setProperty("--now-h", nowSticky.getBoundingClientRect().height + "px");
  const controlsSticky = document.querySelector(".controls-sticky");
  document.documentElement.style.setProperty("--controls-h", (controlsSticky ? controlsSticky.getBoundingClientRect().height : 0) + "px");
}

// ヘッダーの折りたたみは、しきい値+CSSトランジションではなく、スクロール量に直接連動する
// 連続値(--collapse: 0〜1)で駆動する。こうすることで「ある地点で切り替わるアニメーション」が
// 存在しなくなり、どんなにゆっくりスクロールしても指の動きとズレなく追従する。
// rAFで1フレームにつき1回だけ処理をまとめることで、スクロールイベントの多発による負荷も抑えている。
//
// ただし実機では、スクロール開始直後の1秒弱、Android Chromeのアドレスバーが引っ込む
// アニメーションと連動してscrollYの値自体が細かく前後することがある(実際の指の動きとは無関係)。
// これを生の値のまま反映すると、その揺れがそのままチラつきとして見えてしまうため、
// 目標値に対して軽いローパスフィルタ(指数移動平均)をかけて追従させる。
// スクロール量との連動という考え方自体は変えず、細かいノイズだけを吸収する。
const COLLAPSE_RANGE = 60; // この距離(px)スクロールしきると完全に折りたたまれる
const COLLAPSE_SMOOTHING = 0.22; // 小さいほど滑らか(ノイズに強い)/大きいほど追従が速い
let latestScrollY = 0;
let displayedCollapse = 0;
let scrollRafPending = false;
function onScroll() {
  latestScrollY = window.scrollY;
  if (!scrollRafPending) {
    scrollRafPending = true;
    requestAnimationFrame(applyScrollCollapse);
  }
}
function applyScrollCollapse() {
  scrollRafPending = false;
  const target = Math.max(0, Math.min(1, latestScrollY / COLLAPSE_RANGE));
  displayedCollapse += (target - displayedCollapse) * COLLAPSE_SMOOTHING;
  if (Math.abs(target - displayedCollapse) < 0.003) displayedCollapse = target;
  document.documentElement.style.setProperty("--collapse", displayedCollapse);
  syncHeaderHeightVar(); // ヘッダーの高さも連続的に変わるので、フレームごとに追従させる
  if (displayedCollapse !== target) {
    // まだ目標値に収束していなければ、次のフレームも追いかけて滑らかに近づける
    scrollRafPending = true;
    requestAnimationFrame(applyScrollCollapse);
  }
}

/* ============ ポーリング制御(バックグラウンド中は止めてバッテリーを節約) ============ */
let pollTimer = null;
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(fetchState, POLL_MS);
}
function stopPolling() {
  clearInterval(pollTimer);
  pollTimer = null;
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopPolling();
  } else {
    fetchState(); // 復帰した瞬間に最新状態を取りに行く
    startPolling();
  }
});

/* ============ 起動 ============ */
window.addEventListener("scroll", onScroll, { passive: true });
// 実際に画面を動かす操作(ホイール/指で動かす)だけを「手動スクロール中」の合図にする。
// touchstart/mousedownは「進める」等のボタンをタップしただけでも発火してしまい、
// その直後の自動スクロール追従を誤ってブロックしてしまうため使わない。
window.addEventListener("wheel", markManualScroll, { passive: true });
window.addEventListener("touchmove", markManualScroll, { passive: true });

render();
latestScrollY = window.scrollY;
applyScrollCollapse(); // 読み込み時点で既にスクロールされていた場合(再読み込み等)に備え、初期値を合わせておく
fetchState();
startPolling();
</script>
</body>
</html>
